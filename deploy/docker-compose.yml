# Mir Motors — VDS kurulumu: PostgreSQL + uygulama + Caddy (HTTPS).
# Gizli değerler bu klasördeki .env dosyasındadır (git'e girmez). Ayrıntı: VDS_KURULUM.md
name: mirmotors

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mirmotors
      POSTGRES_DB: mirmotors
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirmotors -d mirmotors"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Port dışarı açılmaz: veritabanına yalnızca uygulama erişir.

  app:
    build:
      context: ..
      # Derleme sunucunun kendi ağıyla yapılır (köprü ağında paket indirme yavaş/kararsızdı).
      network: host
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mirmotors:${POSTGRES_PASSWORD}@db:5432/mirmotors
      DATABASE_URL_UNPOOLED: postgresql://mirmotors:${POSTGRES_PASSWORD}@db:5432/mirmotors
      # Erişim şifresi tanımlı değilse CRM açılmaz.
      DEMO_REQUIRE_ACCESS: "1"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

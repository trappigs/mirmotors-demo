# Mir Motors'un Caddy site blokları (yalnızca kaynak/şablon).
#
# Sunucudaki gerçek dosya /opt/mirmotors/app/deploy/Caddyfile ORTAKTIR: aynı Caddy başka
# projelerin sitelerine de hizmet verir (kaderkocbulut.com, berberiz.tr ...). Bu yüzden o dosya
# git'te tutulmaz ve deploy sırasında üzerine yazılmaz. Mir Motors bloğunda değişiklik
# gerekirse sunucudaki ortak dosyada yalnızca aşağıdaki bloklar elle güncellenir.
#
# Upstream konteyner adıyla verilir (mirmotors-app-1): ortak Docker ağında başka projelerin
# konteynerleri de "app" takma adını kullanabildiği için "app:3000" yanlış uygulamaya gidebilir.
# Ön koşul: deploy/.env içinde COOKIE_SECURE=1.

www.mirmotors.com.tr {
	redir https://mirmotors.com.tr{uri} permanent
}

mirmotors.com.tr {
	encode zstd gzip
	request_body {
		max_size 250MB
	}
	header {
		Strict-Transport-Security "max-age=31536000"
	}
	reverse_proxy mirmotors-app-1:3000
}

# IP adresiyle gelen düz HTTP istekleri alan adına yönlendirilir.
:80 {
	redir https://mirmotors.com.tr{uri} permanent
}
